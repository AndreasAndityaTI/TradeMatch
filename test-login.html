<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login - Debug</title>
</head>
<body>
    <h1>Test Login Debug</h1>
    <button id="testBtn">Test Login API Call</button>
    <div id="result"></div>

    <script>
        // Test if we can reach the API
        document.getElementById('testBtn').addEventListener('click', async () => {
            const resultDiv = document.getElementById('result');
            try {
                console.log('Making API request to http://localhost:3000/api/auth/login');
                const response = await fetch('http://localhost:3000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'test@example.com',
                        password: 'Password123'
                    })
                });

                console.log('Response status:', response.status);
                const data = await response.json();
                console.log('Response data:', data);

                if (response.ok) {
                    resultDiv.innerHTML = '<p style="color: green;">✓ Login successful!</p><p>Token: ' + data.token.substring(0, 50) + '...</p>';
                } else {
                    resultDiv.innerHTML = '<p style="color: red;">✗ Login failed: ' + (data.error || data.message) + '</p>';
                }
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = '<p style="color: red;">✗ Error: ' + error.message + '</p>';
            }
        });
    </script>
</body>
</html>
