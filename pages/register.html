<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - TradeMatch</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .password-hint { font-size: 12px; color: #666; margin-top: 5px; }
        .error-message { color: #d32f2f; margin-top: 5px; }
        .success-message { color: #388e3c; margin-top: 5px; }
        .loading { display: none; }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">TradeMatch</div>
            <button id="sidebarToggle" class="hamburger" aria-label="Toggle menu">☰</button>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="auth-form">
            <h2>Create Your Account</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="full_name">Full Name</label>
                    <input type="text" id="full_name" name="full_name" placeholder="Your full name" required>
                </div>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Choose a username" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Min 6 chars, 1 uppercase, 1 number" required>
                    <div class="password-hint">✓ At least 6 characters • ✓ 1 uppercase letter • ✓ 1 number</div>
                </div>
                <div class="form-group">
                    <label for="userType">Account Type</label>
                    <select id="userType" name="userType" required>
                        <option value="">Select your role</option>
                        <option value="seller">Seller (I want to sell products)</option>
                        <option value="buyer">Buyer (I want to buy products)</option>
                        <option value="both">Both (I buy and sell)</option>
                    </select>
                </div>
                <button type="submit" class="cta-button">Create Account</button>
                <div id="registerMessage"></div>
            </form>
            <p>Already have an account? <a href="login.html">Login here</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 TradeMatch. All rights reserved.</p>
    </footer>

    <script src="../js/api-client.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        // Hamburger menu toggle for mobile
        document.addEventListener('DOMContentLoaded', function() {
            const sidebarToggle = document.getElementById('sidebarToggle');
            const nav = document.querySelector('nav');
            const ul = nav.querySelector('ul');

            if (sidebarToggle && ul) {
                sidebarToggle.addEventListener('click', function() {
                    // Only toggle on mobile screens
                    if (window.innerWidth <= 768) {
                        ul.classList.toggle('mobile-open');
                    }
                });

                // Close menu when clicking outside
                document.addEventListener('click', function(event) {
                    if (!nav.contains(event.target) && window.innerWidth <= 768) {
                        ul.classList.remove('mobile-open');
                    }
                });
            }
        });
    </script>
</body>
</html>
