<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TradeMatch</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .auth-container { max-width: 500px; margin: 50px auto; padding: 30px; background: #f5f5f5; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
        .form-group input:focus { outline: none; border-color: #0066cc; box-shadow: 0 0 5px rgba(0, 102, 204, 0.3); }
        .error-message { color: #d32f2f; margin-top: 10px; padding: 10px; background: #ffebee; border-radius: 4px; }
        .success-message { color: #388e3c; margin-top: 10px; padding: 10px; background: #e8f5e9; border-radius: 4px; }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">TradeMatch</div>
            <button id="sidebarToggle" class="hamburger" aria-label="Toggle menu">☰</button>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="register.html">Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="auth-container">
            <h2>Welcome Back!</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="cta-button" style="width: 100%;">Login</button>
                <div id="loginMessage"></div>
            </form>
            <p style="text-align: center; margin-top: 20px;">
                Don't have an account? <a href="register.html">Sign up here</a>
            </p>
            <p style="text-align: center; font-size: 12px; color: #666; margin-top: 20px;">
                Demo Account: test@example.com / Password123
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 TradeMatch. All rights reserved.</p>
    </footer>

    <script src="../js/api-client.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        // Hamburger menu toggle for mobile
        document.addEventListener('DOMContentLoaded', function() {
            const sidebarToggle = document.getElementById('sidebarToggle');
            const nav = document.querySelector('nav');
            const ul = nav.querySelector('ul');

            if (sidebarToggle && ul) {
                sidebarToggle.addEventListener('click', function() {
                    // Only toggle on mobile screens
                    if (window.innerWidth <= 768) {
                        ul.classList.toggle('mobile-open');
                    }
                });

                // Close menu when clicking outside
                document.addEventListener('click', function(event) {
                    if (!nav.contains(event.target) && window.innerWidth <= 768) {
                        ul.classList.remove('mobile-open');
                    }
                });
            }
        });
    </script>
</body>
</html>
