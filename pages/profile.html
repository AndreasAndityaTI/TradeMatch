<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - TradeMatch</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .profile-container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .profile-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
        .profile-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 40px; text-align: center; }
        .profile-name { font-size: 32px; font-weight: bold; margin-bottom: 10px; }
        .profile-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 30px; }
        .stat-box { text-align: center; padding: 20px; background: rgba(255,255,255,0.1); border-radius: 8px; }
        .stat-value { font-size: 28px; font-weight: bold; }
        .stat-label { font-size: 12px; margin-top: 5px; opacity: 0.9; }
        .profile-body { padding: 40px; }
        .profile-section { margin-bottom: 30px; }
        .profile-section h3 { color: #333; border-bottom: 2px solid #0066cc; padding-bottom: 10px; }
        .section-content { margin-top: 15px; }
        .info-item { display: flex; margin-bottom: 15px; }
        .info-label { font-weight: bold; width: 150px; color: #666; }
        .info-value { flex: 1; }
        .rating-display { display: flex; align-items: center; gap: 15px; }
        .stars { font-size: 24px; color: #ffa500; }
        .rating-text { display: flex; flex-direction: column; }
        .rating-score { font-size: 20px; font-weight: bold; }
        .rating-count { font-size: 12px; color: #666; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .product-card { background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px solid #ddd; }
        .product-card h4 { margin-top: 0; }
        .product-price { color: #0066cc; font-weight: bold; font-size: 18px; }
        .action-buttons { display: flex; gap: 10px; margin-bottom: 30px; }
        .btn { padding: 12px 30px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .btn-primary { background: #0066cc; color: white; }
        .btn-primary:hover { background: #0052a3; }
        .btn-secondary { background: #666; color: white; }
        .btn-secondary:hover { background: #555; }
        .reviews-section { background: #f9f9f9; padding: 20px; border-radius: 8px; }
        .review { margin-bottom: 20px; padding: 15px; background: white; border-left: 4px solid #0066cc; border-radius: 4px; }
        .review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .review-author { font-weight: bold; }
        .review-rating { color: #ffa500; }
        .review-date { font-size: 12px; color: #666; }
        .empty-message { text-align: center; color: #999; padding: 20px; }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">TradeMatch</div>
            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="products.html">Browse</a></li>
                <li><a href="../index.html">Home</a></li>
                <li><a href="#" onclick="logout()">Logout</a></li>
            </ul>
        </nav>
    </header>

    <div class="profile-container">
        <div id="profileContent"></div>
    </div>

    <footer>
        <p>&copy; 2023 TradeMatch. All rights reserved.</p>
    </footer>

    <script src="../js/api-client.js"></script>
    <script>
        const api = new TradeMatchAPI();
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('id');

        window.addEventListener('load', async () => {
            const isAuth = await api.checkAuth();
            if (!isAuth) {
                window.location.href = 'login.html';
                return;
            }

            if (!userId) {
                document.getElementById('profileContent').innerHTML = '<p style="text-align: center; color: #999;">No user specified.</p>';
                return;
            }

            loadProfile();
        });

        async function loadProfile() {
            try {
                const [userProfile, userProducts] = await Promise.all([
                    api.getUserProfile(userId),
                    api.getUserProducts(userId)
                ]);

                displayProfile(userProfile.user, userProducts.products);
            } catch (error) {
                document.getElementById('profileContent').innerHTML = `<p style="text-align: center; color: red;">Error loading profile: ${error.message}</p>`;
            }
        }

        function displayProfile(user, products) {
            let html = `
                <div class="profile-card">
                    <div class="profile-header">
                        <div class="profile-name">${escapeHtml(user.full_name || user.username)}</div>
                        <div style="opacity: 0.9; margin-top: 10px;">${escapeHtml(user.location || 'Location not specified')}</div>
                        
                        <div class="profile-stats">
                            <div class="stat-box">
                                <div class="stat-value">${user.trade_count || 0}</div>
                                <div class="stat-label">Completed Trades</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-value">★ ${(user.rating || 0).toFixed(1)}</div>
                                <div class="stat-label">Rating</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-value">${user.type || 'Both'}</div>
                                <div class="stat-label">Account Type</div>
                            </div>
                        </div>
                    </div>

                    <div class="profile-body">
                        <div class="action-buttons">
                            <button class="btn btn-primary" onclick="contactUser()">💬 Contact Seller</button>
                        </div>

                        <div class="profile-section">
                            <h3>About</h3>
                            <div class="section-content">
                                <div class="info-item">
                                    <div class="info-label">Username:</div>
                                    <div class="info-value">${escapeHtml(user.username)}</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-label">Location:</div>
                                    <div class="info-value">${escapeHtml(user.location || 'Not specified')}</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-label">Phone:</div>
                                    <div class="info-value">${escapeHtml(user.phone || 'Not provided')}</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-label">Bio:</div>
                                    <div class="info-value">${escapeHtml(user.bio || 'No bio provided')}</div>
                                </div>
                            </div>
                        </div>

                        <div class="profile-section">
                            <h3>Ratings & Reviews</h3>
                            <div class="section-content">
                                <div class="rating-display">
                                    <div class="stars">${'★'.repeat(Math.round(user.rating || 0))}${'☆'.repeat(5 - Math.round(user.rating || 0))}</div>
                                    <div class="rating-text">
                                        <div class="rating-score">${(user.rating || 0).toFixed(1)}/5.0</div>
                                        <div class="rating-count">Based on ${user.trade_count || 0} trades</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="profile-section">
                            <h3>Products (${products.length})</h3>
                            ${products.length > 0 ? `
                                <div class="products-grid">
                                    ${products.map(p => `
                                        <div class="product-card">
                                            <h4>${escapeHtml(p.title)}</h4>
                                            <p style="color: #666; font-size: 12px;">${escapeHtml(p.category || 'General')}</p>
                                            <div class="product-price">${p.currency} ${parseFloat(p.price).toFixed(2)}</div>
                                            <p style="font-size: 12px; color: #999; margin-top: 10px;">${escapeHtml(p.description || 'No description').substring(0, 50)}...</p>
                                            <button class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 8px;" 
                                                    onclick="showInterest(${p.id}, ${user.id})">Interested</button>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : `
                                <div class="empty-message">This user hasn't listed any products yet.</div>
                            `}
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('profileContent').innerHTML = html;
        }

        async function contactUser() {
            const message = prompt('Send a message to this seller:');
            if (message === null) return;

            try {
                await api.sendMessage(userId, message);
                alert('Message sent successfully!');
            } catch (error) {
                alert('Error sending message: ' + error.message);
            }
        }

        async function showInterest(productId, sellerId) {
            const message = prompt('Optional: Add a message with your interest:');
            if (message === null) return;

            try {
                await api.createMatch(sellerId, productId);
                if (message.trim()) {
                    await api.sendMessage(sellerId, message);
                }
                alert('Interest registered! You can now message the seller.');
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        function logout() {
            api.logout();
            window.location.href = '../index.html';
        }
    </script>
</body>
</html>
